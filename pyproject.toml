[project]
name = "redactor-local"
version = "0.2.1"
description = "Local, reversible sensitive-data substitution desktop application"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.9,<7", "cryptography>=45,<51", "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4", "python-pptx>=1.0,<2", "pypdfium2>=4.30,<6",
  "prompt_toolkit>=3,<4", "py7zr>=1,<2", "rarfile>=4,<5", "Pillow>=11,<13", "striprtf>=0.0.29,<1", "odfpy>=1.4,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "pyinstaller>=6"]

[project.scripts]
redactor-cli = "redactor.cli:main"

[project.gui-scripts]
redactor = "redactor.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["redactor*"]

[tool.setuptools.package-data]
redactor = ["resources/*.md", "resources/*.1", "resources/examples/*.txt", "resources/examples/*.md", "resources/examples/*.json"]
